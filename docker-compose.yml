# Démarrage complet en une commande (ENF5) : docker compose up --build
# Front : http://localhost:3000 · API : http://localhost:8080
# Documentation : http://localhost:8080/swagger-ui.html (générée) · http://localhost:8090 (contrat imposé)
# Ports déjà pris sur ton poste ? API_PORT=18080 FRONT_PORT=13000 CONTRAT_PORT=18090 docker compose up --build
# Les identifiants PostgreSQL ci-dessous sont ceux d'une base locale de démonstration,
# jamais exposée hors de Docker : ce ne sont pas des secrets.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: presence
      POSTGRES_USER: presence
      POSTGRES_PASSWORD: presence
    volumes:
      - donnees-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U presence -d presence"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/presence
      DB_USER: presence
      DB_PASSWORD: presence
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8080}:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "${FRONT_PORT:-3000}:80"

  # Swagger UI du contrat imposé api/contrat.yaml (#75), lu directement dans le dépôt, sans copie.
  # Consultation : pour essayer les opérations, utiliser la documentation générée par l'API.
  contrat:
    image: swaggerapi/swagger-ui:v5.17.14
    environment:
      SWAGGER_JSON: /contrat/contrat.yaml
    volumes:
      - ./api:/contrat:ro
    ports:
      - "${CONTRAT_PORT:-8090}:8080"

volumes:
  donnees-postgres:
