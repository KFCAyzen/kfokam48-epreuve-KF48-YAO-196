server {
    listen 80;
    root /usr/share/nginx/html;

    # Les appels de la couche src/api partent vers le service « backend » de docker-compose.yml.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Documentation Swagger générée par le backend (#75), aussi accessible depuis le port du front.
    # Host avec son port, pour que les redirections de Swagger UI restent sur ce port.
    location /swagger-ui {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
    }

    location /v3/api-docs {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
    }

    # Routes du front (/formateur, /etudiant, /relecteur) : toujours servir index.html.
    location / {
        try_files $uri /index.html;
    }
}
