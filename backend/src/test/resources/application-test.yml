# Profil des tests (B6) : la même base que l'application, PostgreSQL 16, dans un conteneur jetable
# démarré par Testcontainers au premier accès et partagé par tous les tests. Aucune base installée
# localement : Docker suffit. Les mêmes migrations Flyway s'appliquent et Hibernate valide le schéma.
spring:
  datasource:
    url: jdbc:tc:postgresql:16-alpine:///presence?TC_DAEMON=true
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    username: test
    password: test
